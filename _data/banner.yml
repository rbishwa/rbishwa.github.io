# Homepage banner slideshow.
#
# Images cross-fade automatically, in the order listed here.
#   image    - path relative to /images/
#   alt      - description for screen readers and for when the image fails to load
#   position - optional CSS object-position; which part of the photo survives the
#              crop. Default is "center". The banner is a wide strip, so a 3:2
#              photo loses roughly a quarter of its height - lower percentages
#              keep more of the top, which is usually where heads are.
#
# Timing lives in _includes/banner.html (slide_seconds).

- image: banner/illuminated-tube-rack.jpg
  alt: "Bishwa Ranjan Si at an illuminated rack of conical tubes in the lab"
  position: "center 4%"

- image: banner/pipette-bench.jpg
  alt: "Bishwa Ranjan Si setting a micropipette at the lab bench"
  position: "center 22%"

- image: banner/cell-culture-hood.jpg
  alt: "Bishwa Ranjan Si pipetting into a culture flask inside a biosafety cabinet"
  position: "center 34%"
